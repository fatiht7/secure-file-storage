name: PHP syntax

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: php:8.3-cli

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check PHP syntax
        run: find drivecrypto -type f -name '*.php' -exec php -l '{}' \;
